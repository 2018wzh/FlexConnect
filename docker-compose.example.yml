services:
  flexconnect:
    build: .
    image: flexconnect:local
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1080:1080"
    volumes:
      - flexconnect-state:/var/lib/flexconnect
    environment:
      FLEXCONNECT_SERVER: ${FLEXCONNECT_SERVER:?set FLEXCONNECT_SERVER}
      FLEXCONNECT_USERNAME: ${FLEXCONNECT_USERNAME:?set FLEXCONNECT_USERNAME}
      FLEXCONNECT_GROUP: ${FLEXCONNECT_GROUP:-}
      FLEXCONNECT_PASSWORD_FILE: /run/secrets/flexconnect_password
      FLEXCONNECT_ACCEPT_SERVER_ROUTES: "true"
      FLEXCONNECT_APPLY_DNS: "true"
      FLEXCONNECT_AUTO_RECONNECT: "true"
      FLEXCONNECT_SOCKS5_ENABLED: "true"
      FLEXCONNECT_SOCKS5_LISTEN: 0.0.0.0:1080
    secrets:
      - flexconnect_password

secrets:
  flexconnect_password:
    file: ./secrets/flexconnect_password

volumes:
  flexconnect-state:
